    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

      "mainEntity": [
        {"@type":"Question","name":"Comment fonctionne la conversion de devises ?","acceptedAnswer":{"@type":"Answer","text":"Mon Jeton détecte automatiquement la devise sur vos factures et reçus. Si le montant est en USD, EUR ou toute autre devise, il est converti en FCFA au taux du jour en temps réel."}},
        {"@type":"Question","name":"Comment fonctionne le scan IA ?","acceptedAnswer":{"@type":"Answer","text":"Prenez en photo votre facture ou capture d'écran Mobile Money. Notre IA détecte le marchand, le montant, la devise et la date, puis crée la transaction automatiquement."}},
        {"@type":"Question","name":"Mes données sont-elles sécurisées ?","acceptedAnswer":{"@type":"Answer","text":"Absolument. Toutes vos données sont chiffrées de bout en bout et stockées de manière sécurisée. Nous ne partageons jamais vos informations financières avec des tiers."}},
        {"@type":"Question","name":"Mon Jeton est-il disponible sur mobile ?","acceptedAnswer":{"@type":"Answer","text":"Oui ! Mon Jeton est disponible sur Android et iOS. Vous pouvez aussi utiliser l'application web depuis n'importe quel navigateur."}},
        {"@type":"Question","name":"Quels moyens de paiement sont supportés ?","acceptedAnswer":{"@type":"Answer","text":"Mon Jeton supporte Orange Money, MTN MoMo, Wave, Moov Money, ainsi que les cartes Visa et Mastercard."}}
      ]
    }
    </script>

    <script>
      /* Applique le thème enregistré avant le premier affichage.
         next-themes stocke le choix dans localStorage sous la clé "theme",
         mais son propre script ne s'exécute qu'au chargement de React —
         donc trop tard pour le splash. Ce bloc évite l'éclair de couleur. */
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "cream") {
            document.documentElement.classList.add(t);
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Écran de démarrage — s'affiche AVANT tout JavaScript.
         Aucune image externe : logo en SVG inline, donc zéro requête
         réseau. C'est ce qui rend l'ouverture instantanée même sur un
         téléphone lent. */
      #splash-screen {
        position: fixed; inset: 0; z-index: 99999;
        background: #14171C;
        display: flex; align-items: center; justify-content: center; flex-direction: column;
        transition: opacity 0.35s ease;
      }
      #splash-screen.hide { opacity: 0; pointer-events: none; }
      #splash-logo {
        width: 78px; height: 78px; border-radius: 20px;
        background: linear-gradient(150deg, #7CFF3A, #5fd41f);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 0 44px rgba(124, 255, 58, 0.34);
        animation: sp-pop 0.5s ease-out both;
      }
      #splash-logo span {
        color: #14171C; font-family: system-ui, sans-serif;
        font-weight: 800; font-size: 34px; letter-spacing: -0.04em;
      }
      #splash-screen p {
        color: #7CFF3A; font-family: system-ui, sans-serif;
        font-weight: 700; font-size: 19px; margin-top: 18px; letter-spacing: -0.01em;
      }
      #splash-bar {
        margin-top: 20px; width: 132px; height: 3px;
        border-radius: 3px; background: rgba(124, 255, 58, 0.16);
        overflow: hidden;
      }
      #splash-bar::after {
        content: ""; display: block; height: 100%; width: 40%;
        border-radius: 3px; background: #7CFF3A;
        animation: sp-slide 1.1s ease-in-out infinite;
      }
      @keyframes sp-pop {
        from { transform: scale(0.82); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      @keyframes sp-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
      /* Le splash suit le thème choisi. Le carré du logo reste lime dans
         tous les cas : c'est une surface pleine avec un M sombre dessus,
         lisible partout. Seuls le fond, le texte et la barre changent. */
      .light #splash-screen { background: #FFFFFF; }
      .cream #splash-screen { background: #FAF8F3; }
      .light #splash-screen p,
      .cream #splash-screen p { color: #26720A; }
      .light #splash-logo,
      .cream #splash-logo { box-shadow: 0 0 30px rgba(38, 114, 10, 0.20); }
      .light #splash-bar,
      .cream #splash-bar { background: rgba(38, 114, 10, 0.14); }
      .light #splash-bar::after,
      .cream #splash-bar::after { background: #26720A; }
      @media (prefers-reduced-motion: reduce) {
        #splash-logo, #splash-bar::after { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="splash-screen">
      <div id="splash-logo"><span>MJ</span></div>
      <p>Mon Jeton</p>
      <div id="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
